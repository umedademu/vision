<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vision</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 9rem);
        font-weight: 400;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <h1>vision</h1>
  </body>
</html>
